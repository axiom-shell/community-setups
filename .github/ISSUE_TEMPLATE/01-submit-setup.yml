name: Submit a setup
description: "Share your axiom setup without using git. Fill this in and a pull request is made for you."
title: "Setup: "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! When you submit (or edit) this issue, a workflow checks your setup and opens a pull request for you. Its result is commented below. **Edit the issue** to fix anything it finds.

        In axiom: **Settings → Maintenance → Community setups → Export and submit…** (or **Share → Export** with both *Include* switches **off**). That writes `~/axiom-….json` in your home folder, holding only your look and layout: drag that file into **Exported config** below. See the [guide](https://github.com/axiom-shell/community-setups/blob/main/CONTRIBUTING.md) for the details.
  - type: input
    id: name
    attributes:
      label: Title
      description: "Its name in the gallery, at most 40 characters."
      placeholder: Glass Harbor
    validations:
      required: true
      min_length: 2
  - type: input
    id: id
    attributes:
      label: Setup id
      description: "Optional. Lowercase letters, digits and dashes. Left empty, it's made from the title. To update a setup of yours, give its id."
      placeholder: glass-harbor
  - type: input
    id: description
    attributes:
      label: Description
      description: "One line, 10 to 140 characters. What it looks like, or what it's for."
    validations:
      required: true
      min_length: 10
  - type: textarea
    id: about
    attributes:
      label: About it
      description: "Optional. The idea behind it, its inspiration, tips for using it. Markdown, at most 2000 characters."
  - type: dropdown
    id: tags
    attributes:
      label: Tags
      description: "Pick 1 to 6."
      multiple: true
      options: [dark, light, minimal, dense, colorful, monochrome, floating, docked, vertical, sidebar, multi-bar, pills, powerline, outline, transparent, glass, rounded, sharp, retro, laptop, ultrawide, multi-monitor, keyboard-driven, dock]
    validations:
      required: true
  - type: dropdown
    id: tested
    attributes:
      label: Tested on
      description: "The compositors you ran it on."
      multiple: true
      options: [Hyprland, niri, sway]
    validations:
      required: true
  - type: input
    id: fonts
    attributes:
      label: Fonts
      description: "Optional. Font families it uses besides the one set in the export (Settings → Look & Feel → Font), which is added for you. Comma-separated; users without one see a fallback."
      placeholder: Inter, JetBrainsMono Nerd Font
  - type: textarea
    id: config
    attributes:
      label: Exported config
      description: "Drag in the `axiom-….json` file the export wrote (or click here, then attach it). Pasting its contents works too."
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: "Drag in one screenshot of the whole screen with this setup, unedited: PNG, JPEG or WebP, 1280–7680 px wide, 4:3 to 32:9 (one over 3 MB is converted to WebP). Nothing private on screen."
    validations:
      required: true
  - type: textarea
    id: theme
    attributes:
      label: Theme
      description: "Optional: leave it empty if you use a theme axiom ships. Only for a theme you made, or one generated from your wallpaper (`~/.local/state/axiom/themes/<name>.json`): drag that file in, or paste its contents. It's renamed after your setup."
  - type: textarea
    id: wallpaper
    attributes:
      label: Wallpaper
      description: "Optional. Drag in the wallpaper: PNG, JPEG or WebP, at most 10 MB. Users choose whether to use it. Only one you made or one whose license allows sharing; fill in the two fields below with it."
  - type: input
    id: license
    attributes:
      label: Wallpaper license
      description: "With a wallpaper. An SPDX id (CC0-1.0, CC-BY-4.0, …), or `own` for your own work."
  - type: input
    id: source
    attributes:
      label: Wallpaper source
      description: "With a wallpaper. Where it comes from (an https link), or `own`."
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I exported it with **Export and submit…** (or **Share → Export**, both *Include* switches off).
          required: true
        - label: The screenshot shows this exact setup, unedited, with nothing private on screen (notifications, names, emails).
          required: true
        - label: I ran it on the compositors I ticked, and it looks right with a fallback font.
          required: true
        - label: Anything I attached is mine to share, or its license allows it.
          required: true
