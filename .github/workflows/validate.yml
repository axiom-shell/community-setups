name: Validate

# A setup is checked when it's posted or changed, against axiom's main as
# it is that day (its edge build and the commit it was built from, fetched
# by scripts/axiom.sh), and never again: axiom migrates an older setup's config when someone
# applies it, as it does any import. So each run checks only the setups
# the change touches (HEAD^1 is the base: a pull request's merge commit,
# a squash merge on main, or a submission's one commit on its branch).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Check every setup, not only the last commit's
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The org allows only its own SHA-pinned actions, so no actions here:
    # plain git and gh, in Arch like axiom's CI
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git python python-pillow python-jsonschema python-yaml github-cli

      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=2 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Fetch axiom (edge)
        run: scripts/axiom.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validator tests
        run: |
          python3 tests/test_templates.py
          python3 tests/test_validate.py
          python3 tests/test_issue.py

      - name: Check setups
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ inputs.all }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$ALL" = true ]; then
            scripts/check.sh
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD | sed -n 's#^setups/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, -)
          if [ -z "$changed" ]; then
            echo "No setup changed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--changed "$changed")
          # Submissions from issues are opened by the bot, which checked
          # the issue's author already (scripts/issue_to_setup.py)
          if [ "$EVENT" = pull_request ] && [ "$PR_AUTHOR" != "github-actions[bot]" ]; then
            args+=(--pr-author "$PR_AUTHOR" --base-rev HEAD^1)
          fi
          scripts/check.sh "${args[@]}"
